<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabbit Tank</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#6b7280; --card:#fff; --line:#e5e7eb; --ok:#16a34a; --low:#d97706; --crit:#dc2626; --fault:#6b7280; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --fg:#e5e7eb; --muted:#9ca3af; --card:#171a21; --line:#2a2f3a; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 20px; margin: 0; display:flex; justify-content:space-between; align-items:baseline; gap: 8px; flex-wrap: wrap; }
  h1 small { color: var(--muted); font-weight: normal; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .gauge { display:flex; gap:16px; align-items:center; }
  .tank { width: 64px; height: 120px; border: 2px solid var(--line); border-radius: 6px 6px 10px 10px; position: relative; overflow: hidden; flex: none; }
  .tank .water { position:absolute; left:0; right:0; bottom:0; height:0%; background: var(--accent); transition: height .6s; }
  .big { font-size: 34px; font-weight: 600; line-height: 1; }
  .state { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; background: var(--fault); }
  .state.ok { background: var(--ok); } .state.low { background: var(--low); } .state.critical { background: var(--crit); }
  .kv { display:grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 14px; color: var(--muted); }
  .kv b { color: var(--fg); font-weight: 500; }
  form { display:grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  label { display:grid; gap:4px; font-size: 13px; color: var(--muted); }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); width: 100%; }
  .row { grid-column: 1 / -1; display:flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color:#fff; }
  button.danger { color: var(--crit); }
  .msg { font-size: 13px; color: var(--muted); min-height: 1.2em; }
  @media (max-width: 520px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1><span id="name">Tank</span> <small id="meta">connecting…</small></h1>

  <section class="card gauge">
    <div class="tank"><div class="water" id="water"></div></div>
    <div>
      <div class="big"><span id="pct">–</span><span style="font-size:18px">%</span></div>
      <div><span class="state" id="state">unknown</span> <span id="event" style="color:var(--muted);font-size:13px"></span></div>
      <div class="kv" style="margin-top:8px">
        <span>Volume</span><b><span id="litres">–</span> L</b>
        <span>Depth</span><b><span id="depth">–</span> mm</b>
        <span>Distance</span><b><span id="mm">–</span> mm</b>
        <span>WiFi</span><b id="wifi">–</b>
        <span>Server</span><b id="server">–</b>
        <span>Sample</span><b id="sample">–</b>
      </div>
    </div>
  </section>

  <section class="card">
    <form id="cfg">
      <label>Device name <input name="name" maxlength="32"></label>
      <label>WiFi SSID <input name="wifi_ssid" maxlength="32"></label>
      <label>WiFi password <input name="wifi_password" type="password" maxlength="64" placeholder="(unchanged)"></label>
      <label>Server URL (base) <input name="api_url" maxlength="128" placeholder="http://192.168.1.10:3000/api/v1"></label>
      <label>Server token (issued automatically) <input name="api_token" type="password" maxlength="64" placeholder="(unchanged)"></label>
      <label>Litres per mm <input name="litres_per_mm" type="number" step="0.0001" min="0"></label>
      <label>Empty distance (mm) <input name="empty_mm" type="number" min="0" max="4500"></label>
      <label>Full distance (mm) <input name="full_mm" type="number" min="0" max="4500"></label>
      <label>Sample every (s) <input name="sample_interval_s" type="number" min="1" max="3600"></label>
      <label>Report every (s) <input name="report_interval_s" type="number" min="10" max="43200"></label>
      <label>Low below (%) <input name="low_pct" type="number" min="1" max="100"></label>
      <label>Critical below (%) <input name="critical_pct" type="number" min="0" max="99"></label>
      <div class="row">
        <button class="primary" type="submit">Save</button>
        <button type="button" data-cmd="calibrate_full">Mark as FULL</button>
        <button type="button" data-cmd="calibrate_empty">Mark as EMPTY</button>
        <button type="button" data-cmd="test_report">Send test report</button>
        <button type="button" data-cmd="enroll" data-confirm="Forget the server token and enrol again?">Re-enrol</button>
        <button type="button" data-cmd="ble">Open Bluetooth</button>
        <button type="button" data-cmd="reboot">Reboot</button>
        <button type="button" class="danger" data-cmd="factory_reset" data-confirm="Erase all settings and reboot?">Factory reset</button>
      </div>
      <div class="row msg" id="msg"></div>
    </form>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = (v, d=1) => v == null ? '–' : Number(v).toFixed(d);
async function refresh() {
  try {
    const s = await (await fetch('/api/status')).json();
    $('name').textContent = s.name;
    $('meta').textContent = `${s.device_id} · fw ${s.fw} · up ${Math.floor(s.uptime_s/3600)}h${Math.floor(s.uptime_s%3600/60)}m`;
    const l = s.level || {};
    $('pct').textContent = fmt(l.percent, 0);
    $('water').style.height = (l.percent ?? 0) + '%';
    $('litres').textContent = fmt(l.litres);
    $('depth').textContent = l.depth_mm ?? '–';
    $('mm').textContent = s.raw_mm ?? '–';
    const st = $('state'); st.textContent = s.state + (s.calibrated ? '' : ' (uncalibrated)'); st.className = 'state ' + s.state;
    $('event').textContent = s.last_event ? 'last event: ' + s.last_event : '';
    $('wifi').textContent = s.wifi_connected ? `${s.ip} (${s.rssi} dBm)` : 'disconnected';
    const r = s.report || {};
    const srv = { no_server: 'not configured', offline: 'offline', pending_approval: 'enrolled, waiting for approval in the farm app',
                  unauthorized: 'token rejected', enrol_failed: 'enrolment failed, retrying', connect_failed: 'unreachable', timeout: 'timeout' };
    $('server').textContent = r.last_error ? (srv[r.last_error] || r.last_error) + ` · ${r.queued} queued`
                                           : (r.sent ? `ok · ${r.sent} sent` : (r.enrolled ? 'enrolled' : 'not enrolled'));
    $('sample').textContent = `#${s.sample_no}, ${s.uptime_s - s.sampled_uptime_s}s ago`;
  } catch (e) { $('meta').textContent = 'offline'; }
}
async function loadConfig() {
  const c = await (await fetch('/api/config')).json();
  const f = $('cfg');
  for (const [k, v] of Object.entries(c)) if (f.elements[k] && !/password|token/.test(k)) f.elements[k].value = v;
  f.elements.wifi_password.placeholder = c.wifi_password_set ? '(set, unchanged)' : '(not set)';
  f.elements.api_token.placeholder = c.api_token_set ? '(set, unchanged)' : '(not set)';
}
$('cfg').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, body = {};
  for (const el of f.elements) {
    if (!el.name) continue;
    if (/password|token/.test(el.name) && el.value === '') continue;
    body[el.name] = el.type === 'number' ? Number(el.value) : el.value;
  }
  const r = await fetch('/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  $('msg').textContent = r.ok ? 'Saved.' : 'Save failed: ' + r.status;
  f.elements.wifi_password.value = ''; f.elements.api_token.value = '';
  loadConfig();
});
document.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', async () => {
  if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
  const r = await fetch('/api/command', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({command: b.dataset.cmd}) });
  $('msg').textContent = r.ok ? `Command "${b.dataset.cmd}" sent.` : 'Command failed: ' + r.status;
  setTimeout(() => { refresh(); loadConfig(); }, 800);
}));
refresh(); loadConfig(); setInterval(refresh, 5000);
</script>
</body>
</html>
