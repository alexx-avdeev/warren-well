[package]
name         = "tank-core"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
description  = "Hardware-independent logic of the rabbit water tank level monitor"

[dependencies]
heapless = { version = "0.9.3", features = ["serde"] }
serde    = { version = "1.0", default-features = false, features = ["derive"] }
